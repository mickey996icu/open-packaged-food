version = 1
SPDX-PackageName = "open-packaged-food"
SPDX-PackageDownloadLocation = "https://github.com/mickey996icu/open-packaged-food"

# Core tooling, CLI, Web Explorer, CI workflows, build config, and tests
[[annotations]]
path = [
  "bin/**",
  "opf/**",
  "tests/**",
  ".github/**",
  "web/*.js",
  "web/index.html",
  "web/*.css",
  "web/locales/**",
  "pyproject.toml",
  "setup.py",
  "MANIFEST.in",
  ".gitignore",
]
precedence = "override"
SPDX-FileCopyrightText = "OpenPackagedFood Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Bundled third-party ZXing barcode/QR library preserves upstream Apache-2.0 terms
[[annotations]]
path = "web/vendor/zxing*"
precedence = "override"
SPDX-FileCopyrightText = "ZXing Authors"
SPDX-License-Identifier = "Apache-2.0"

# Bundled Sarasa Mono ASCII & archival symbol WOFF subset preserves upstream SIL OFL-1.1 terms
[[annotations]]
path = [
  "web/vendor/sarasa-mono-*.woff",
  "web/vendor/LICENSE-SARASA.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "Renzhi Li (Belleve Invis), The Inter Project Authors, Adobe Systems Incorporated, and Google Inc."
SPDX-License-Identifier = "OFL-1.1"

# Specifications, JSON Schemas, regulatory profiles, factual dictionaries, Agent skills, and docs
[[annotations]]
path = [
  "spec/**",
  "dictionaries/**",
  "profiles/**",
  "skills/**",
  "docs/**",
  "README*.md",
  "CONTRIBUTING*.md",
  "GOVERNANCE*.md",
]
precedence = "override"
SPDX-FileCopyrightText = "OpenPackagedFood Contributors"
SPDX-License-Identifier = "Apache-2.0"
