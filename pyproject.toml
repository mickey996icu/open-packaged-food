[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-packaged-food"
version = "0.3.3"
description = "Git-native, evidence-first global packaged food open database toolkit and Agent CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["Pillow>=10.0"]

[project.scripts]
opf = "opf.cli:main"

[tool.setuptools.packages.find]
include = ["opf*"]
